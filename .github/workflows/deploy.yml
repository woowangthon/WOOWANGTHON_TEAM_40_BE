name: Deploy

# main 에 푸시하면 테스트, 이미지 빌드, 동아리방 컴퓨터 배포를 차례로 한다.
# 프런트엔드만 바뀌었을 때는 Actions 화면에서 이 워크플로를 직접 실행한다.
# 배포 단계는 동아리방 컴퓨터의 self-hosted 러너에서 돌므로 pull_request 에서는 실행하지 않는다.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/woowangthon/woowangthon-team-40

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pyright app tests
      - run: pytest
        env:
          SECRET_KEY: ${{ github.sha }}

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Dockerfile 은 frontend 와 backend 가 나란히 있는 폴더를 빌드 기준으로 삼는다
      - uses: actions/checkout@v4
        with:
          path: backend
      - uses: actions/checkout@v4
        with:
          repository: woowangthon/WOOWANGTHON_TEAM_40_FE
          path: frontend
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, woowang]
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          # 러너 폴더에 써 둔 .env 를 지우지 않는다
          clean: false
      - name: Write env file
        env:
          ENV_DOCKER: ${{ secrets.ENV_DOCKER }}
        run: $env:ENV_DOCKER | Set-Content -Encoding UTF8 .env
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Windows PowerShell 5.1 은 코드페이지 65001 에서 파이프 입력 앞에 BOM 을 붙여 토큰이 거부된다
        run: |
          [Console]::InputEncoding = New-Object System.Text.UTF8Encoding $false
          $env:GHCR_TOKEN | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # 자리 4 작업공간이 학생 코드를 돌릴 때 쓰는 이미지. 미리 받아 두지 않으면 첫 실행이 시간 제한에 걸린다
      - name: Pull code run images
        run: |
          docker pull python:3.12-slim
          docker pull gcc:14
          docker pull eclipse-temurin:21-jdk
      - name: Pull image
        run: docker compose -f docker-compose.prod.yml pull
      # 같은 컴퓨터의 다른 서비스를 건드리지 않도록 --remove-orphans 를 붙이지 않는다
      - name: Start
        run: docker compose -f docker-compose.prod.yml up -d
      - name: Remove dangling images
        run: docker image prune -f
