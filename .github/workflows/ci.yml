name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Type check
        run: pyright app tests
      - name: Test
        env:
          SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
        run: pytest
